name: Publish

# A release is a deliberate act: push a `v<version>` tag that matches
# package.json, on a commit that is on main and already passed CI.
#
#   npm run release -- tag   (or: git tag v1.0.0 && git push origin v1.0.0)
#
# Nothing else publishes. Merges to main never do.
#
# A tag runs publish.yml as it exists at the tagged commit, so the checks below
# only hold if the repository settings in docs/development.md ("Protecting
# publishing") limit who can push v* tags and which refs may use the
# marketplace environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for Microsoft Entra ID sign-in, once configured
  actions: read # look up the CI run for the tagged commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the publishing credentials. A fixed environment also gives the
    # Entra ID federated credential a fixed subject to trust:
    # repo:aiandlabs/aiand-copilot-chat:environment:marketplace
    environment: marketplace
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-ancestry check needs history
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the tag, main, CI, changelog, and Marketplace
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          EXTENSION="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          CI="$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq 'length')"
          if [ "$CI" = "0" ]; then
            echo "::error::no successful CI run on main for $GITHUB_SHA; wait for CI (or fix it) and re-push the tag"
            exit 1
          fi
          # The GitHub release is created after the Marketplace publish, from
          # this section; check it now so a missing one fails before anything
          # is published.
          if ! node scripts/release.mjs notes "$VERSION" > /dev/null; then
            echo "::error::CHANGELOG.md has no [$VERSION] section; add it and re-push the tag"
            exit 1
          fi
          # `vsce show` prints `undefined` for an extension that was never published
          # and exits non-zero when it cannot reach the Marketplace; only the
          # first counts as "no versions yet".
          if ! SHOWN="$(npx --no-install vsce show "$EXTENSION" --json)"; then
            echo "::error::could not read $EXTENSION from the Marketplace; re-run the job once it is reachable"
            exit 1
          fi
          PUBLISHED="$(printf '%s' "$SHOWN" | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { const info = s.trim() === "undefined" ? {} : JSON.parse(s); for (const v of info.versions ?? []) console.log(v.version); });')"
          if printf '%s\n' "$PUBLISHED" | grep -Fxq "$VERSION"; then
            echo "::error::$EXTENSION@$VERSION is already on the Marketplace; bump package.json and tag the new version"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Runs the tests (prepackage) and builds the VSIX that gets published.
      - run: npm run package
      # Two ways to authenticate, chosen by repository configuration:
      #   - Microsoft Entra ID (preferred; Azure DevOps global PATs retire on
      #     2026-12-01): set the AZURE_CLIENT_ID, AZURE_TENANT_ID and
      #     AZURE_SUBSCRIPTION_ID variables on the marketplace environment for a
      #     managed identity that is a Contributor on the publisher.
      #   - Otherwise the VSCE_PAT secret on the marketplace environment.
      - if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The identity only needs the publisher role, not a role on the subscription.
          allow-no-subscriptions: true
      - name: Publish to the Visual Studio Marketplace
        run: |
          set -euo pipefail
          VSIX="aiand-copilot-chat-${GITHUB_REF_NAME#v}.vsix"
          if [ -n "${AZURE_CLIENT_ID}" ]; then
            npx --no-install vsce publish --packagePath "$VSIX" --azure-credential
          elif [ -n "${VSCE_PAT}" ]; then
            npx --no-install vsce publish --packagePath "$VSIX"
          else
            echo "::error::no publishing credentials: set AZURE_CLIENT_ID (Entra ID) or the VSCE_PAT secret on the marketplace environment"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Release notes are the version's CHANGELOG section, not generated ones.
      - run: |
          node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "aiand-copilot-chat-${GITHUB_REF_NAME#v}.vsix" \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
